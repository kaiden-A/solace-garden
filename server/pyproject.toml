[project]
name = "solace-server"
version = "0.1.0"
description = "Solace Garden API - plants, gifts and auth (Zitadel / Elysiaa SSO + guests)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "pg8000>=1.31",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "mcp>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    # mypy is unusable here: its librt native module is blocked by this
    # machine's Application Control policy. Pyright (node-based) is not.
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's whole dependency system lives in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # generated files

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
