<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solace Garden API</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f1ea;
        color: #2f3b2f;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        line-height: 1.6;
        margin: 0 0 0.5rem;
      }
      code {
        background: rgba(47, 59, 47, 0.08);
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #171c17;
          color: #e6e9e2;
        }
        code {
          background: rgba(230, 233, 226, 0.12);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Solace Garden API</h1>
      <p>This host proxies the Solace Garden API at <code>/api</code>.</p>
      <p>The MCP endpoint lives at <code>/mcp</code> (bearer token required).</p>
      <p>
        OAuth discovery: <code>/.well-known/oauth-protected-resource/mcp</code>.
      </p>
    </main>
  </body>
</html>
